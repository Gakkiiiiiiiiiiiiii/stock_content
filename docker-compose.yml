services:
  content-migrate:
    build:
      context: .
      dockerfile: docker/Dockerfile.migration
    environment:
      CONTENT_DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/stock_content
    depends_on:
      postgres:
        condition: service_healthy

  stock-content:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    env_file:
      - path: .env
        required: false
    environment:
      CONTENT_DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/stock_content
      CONTENT_QDRANT_URL: http://qdrant:6333
      CONTENT_QDRANT_COLLECTION: knowledge_v3
      CONTENT_SERVICE_API_KEY_FILE: /run/secrets/content-service-api-key
      # This is read-only in the API container and written only by the video
      # worker after a real GPU OCR probe.
      CONTENT_OCR_HEARTBEAT_FILE: /var/run/stock-content/ocr-heartbeat.json
      CONTENT_OCR_HEARTBEAT_MAX_AGE_SECONDS: "120"
      CONTENT_BILIBILI_CREDENTIAL_REF: ${CONTENT_BILIBILI_CREDENTIAL_REF:-bilibili-cookiefile}
      CONTENT_BILIBILI_STORAGE_STATE_REF: ${CONTENT_BILIBILI_STORAGE_STATE_REF:-bilibili-storage-state}
      CONTENT_XIAOE_HLS_CREDENTIAL_REF: ${CONTENT_XIAOE_HLS_CREDENTIAL_REF:-xiaoe-hls-locator}
      CONTENT_INGESTION_CREDENTIAL_REFS: ${CONTENT_INGESTION_CREDENTIAL_REFS:-bilibili-storage-state,bilibili-cookiefile,xiaoe-hls-locator,xiaoe-storage-state}
    secrets:
      - content-service-api-key
    volumes:
      - content-worker-state:/var/run/stock-content:ro
    ports:
      - "8100:8100"
    depends_on:
      content-migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy

  stock-content-core-worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.core-worker
    env_file:
      - path: .env
        required: false
    command: ["stock-content-worker"]
    environment:
      CONTENT_DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/stock_content
      CONTENT_QDRANT_URL: http://qdrant:6333
      CONTENT_QDRANT_COLLECTION: knowledge_v3
      CONTENT_WORKER_PROFILE: core
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1024M
    depends_on:
      content-migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy

  stock-content-video-worker:
    profiles: [video]
    build:
      context: .
      dockerfile: docker/Dockerfile.video
    env_file:
      - path: .env
        required: false
    command: ["stock-content-worker"]
    environment:
      CONTENT_DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/stock_content
      CONTENT_QDRANT_URL: http://qdrant:6333
      CONTENT_QDRANT_COLLECTION: knowledge_v3
      CONTENT_WORKER_PROFILE: video
      CONTENT_WORKER_QUEUE: video_pipeline
      CONTENT_VIDEO_WORKER_HEARTBEAT_FILE: /var/run/stock-content/video-worker-heartbeat.json
      # OCR is a local subprocess in the video worker, but executes only
      # /opt/ocr Python. It must fail closed if the NVIDIA device is absent.
      CONTENT_OCR_PYTHON: /opt/ocr/bin/python
      CONTENT_OCR_DEVICE: gpu:0
      CONTENT_OCR_REQUIRE_GPU: "true"
      CONTENT_OCR_HEARTBEAT_FILE: /var/run/stock-content/ocr-heartbeat.json
      CONTENT_OCR_HEARTBEAT_MAX_AGE_SECONDS: "120"
      CONTENT_OCR_CACHE_HOME: /var/cache/stock-content/ocr
      CONTENT_OCR_LIBRARY_PATH: /usr/local/cuda/lib64:/opt/ocr/lib/python3.11/site-packages/nvidia/cuda_runtime/lib:/opt/ocr/lib/python3.11/site-packages/nvidia/cudnn/lib
      CONTENT_XIAOE_STORAGE_STATE_FILE: /run/secrets/xiaoe-storage-state
      CONTENT_BILIBILI_CREDENTIAL_REF: ${CONTENT_BILIBILI_CREDENTIAL_REF:-bilibili-cookiefile}
      CONTENT_BILIBILI_COOKIEFILE: /run/secrets/bilibili-cookiefile
      CONTENT_BILIBILI_STORAGE_STATE_REF: ${CONTENT_BILIBILI_STORAGE_STATE_REF:-bilibili-storage-state}
      CONTENT_BILIBILI_STORAGE_STATE_FILE: /run/secrets/bilibili-storage-state
      CONTENT_XIAOE_HLS_CREDENTIAL_REF: ${CONTENT_XIAOE_HLS_CREDENTIAL_REF:-xiaoe-hls-locator}
      CONTENT_XIAOE_HLS_LOCATOR_FILE: /run/secrets/xiaoe-hls-locator
    volumes:
      - content-worker-state:/var/run/stock-content
      - content-ocr-cache:/var/cache/stock-content/ocr
    secrets:
      - xiaoe-storage-state
      - bilibili-cookiefile
      - bilibili-storage-state
      - xiaoe-hls-locator
    user: "10001:10001"
    read_only: true
    tmpfs:
      - /work:uid=10001,gid=10001,mode=700
      - /data:uid=10001,gid=10001,mode=700
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 4096M
          pids: 128
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    depends_on:
      content-migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy

  verification-worker:
    profiles: [verification]
    build:
      context: .
      dockerfile: docker/Dockerfile.core-worker
    command: ["stock-content-verification-worker"]
    environment:
      CONTENT_DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/stock_content
    env_file:
      - path: .env
        required: false
    depends_on:
      content-migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy

  signal-publisher:
    profiles: [publisher]
    build:
      context: .
      dockerfile: docker/Dockerfile.core-worker
    command: ["stock-content-signal-publisher"]
    environment:
      CONTENT_DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/stock_content
    env_file:
      - path: .env
        required: false
    depends_on:
      content-migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy

  media-worker:
    profiles: [media]
    build:
      context: .
      dockerfile: docker/Dockerfile.media
    command: ["stock-content-worker"]
    environment:
      CONTENT_DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/stock_content
      CONTENT_QDRANT_URL: http://qdrant:6333
      CONTENT_QDRANT_COLLECTION: knowledge_v3
      CONTENT_WORKER_PROFILE: media
      CONTENT_WORKER_QUEUE: media
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 4096M
    depends_on:
      content-migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy

  multimodal-worker:
    profiles: [multimodal]
    build:
      context: .
      dockerfile: docker/Dockerfile.multimodal
    command: ["stock-content-worker"]
    environment:
      CONTENT_DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/stock_content
      CONTENT_QDRANT_URL: http://qdrant:6333
      CONTENT_QDRANT_COLLECTION: knowledge_v3
      CONTENT_WORKER_PROFILE: multimodal
      CONTENT_WORKER_QUEUE: multimodal
    deploy:
      resources:
        limits:
          cpus: "4.0"
          memory: 8192M
    depends_on:
      content-migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: stock_content
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - content-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d stock_content"]
      interval: 5s
      timeout: 5s
      retries: 10

  qdrant:
    profiles: [search]
    image: qdrant/qdrant:v1.12.6
    volumes:
      - content-qdrant:/qdrant/storage

volumes:
  content-postgres:
  content-qdrant:
  content-worker-state:
  content-ocr-cache:

secrets:
  content-service-api-key:
    file: ${CONTENT_SERVICE_API_KEY_HOST_FILE:?set CONTENT_SERVICE_API_KEY_HOST_FILE to a read-only secret file}
  xiaoe-storage-state:
    file: ${CONTENT_XIAOE_STORAGE_STATE_HOST_FILE:?set CONTENT_XIAOE_STORAGE_STATE_HOST_FILE to a read-only secret file}
  bilibili-cookiefile:
    file: ${CONTENT_BILIBILI_COOKIEFILE_HOST_FILE:?set CONTENT_BILIBILI_COOKIEFILE_HOST_FILE to a read-only Netscape cookie file}
  bilibili-storage-state:
    file: ${CONTENT_BILIBILI_STORAGE_STATE_HOST_FILE:?set CONTENT_BILIBILI_STORAGE_STATE_HOST_FILE to a read-only Playwright storage state file}
  xiaoe-hls-locator:
    file: ${CONTENT_XIAOE_HLS_LOCATOR_HOST_FILE:?set CONTENT_XIAOE_HLS_LOCATOR_HOST_FILE to a read-only authorized HLS locator file}
