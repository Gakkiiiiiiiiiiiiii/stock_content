services:
  stock-content:
    build: .
    env_file:
      - path: .env
        required: false
    ports:
      - "8100:8100"
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started

  stock-content-worker:
    build: .
    env_file:
      - path: .env
        required: false
    command: ["stock-content-worker"]
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: stock_content
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - content-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d stock_content"]
      interval: 5s
      timeout: 5s
      retries: 10

  qdrant:
    image: qdrant/qdrant:v1.12.6
    volumes:
      - content-qdrant:/qdrant/storage

volumes:
  content-postgres:
  content-qdrant:
