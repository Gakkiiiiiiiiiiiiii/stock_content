name: content-factor-signal
version: content-factor-signal.v5
type: object
additionalProperties: false
required: [signal_id, signal_schema_version, claim_id, occurrence_id, semantic_segment_id, asserted_at, source_available_at, source_availability_quality, available_from, temporal_bindings, lifecycle, content_snapshot_id]
properties:
  signal_id: {type: string, minLength: 1}
  signal_schema_version: {const: content-factor-signal.v5}
  claim_id: {type: string, minLength: 1}
  occurrence_id: {type: string, minLength: 1}
  semantic_segment_id: {type: string, minLength: 1}
  asserted_at: {type: [string, 'null']}
  source_available_at: {type: [string, 'null']}
  source_availability_quality: {enum: [EXACT, PUBLISHED_TIME_PROXY, INGEST_TIME_UPPER_BOUND, UNKNOWN]}
  available_from: {type: string, minLength: 1}
  temporal_bindings:
    type: array
    items:
      type: object
      additionalProperties: false
      required: [temporal_binding_id, role, scope, period_label, start_date, end_date, assertion_status]
      properties:
        temporal_binding_id: {type: string, minLength: 1}
        role: {type: string, minLength: 1}
        scope: {type: string, minLength: 1}
        period_label: {type: [string, 'null']}
        start_date: {type: [string, 'null']}
        end_date: {type: [string, 'null']}
        assertion_status: {type: string, minLength: 1}
  lifecycle:
    type: object
    additionalProperties: false
    required: [status, lifecycle_artifact_id]
    properties:
      status: {type: string, minLength: 1}
      lifecycle_artifact_id: {type: string, minLength: 1}
  content_snapshot_id: {type: string, minLength: 1}
