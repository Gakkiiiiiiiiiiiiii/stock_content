[project]
name = "stock-content"
version = "0.1.0"
description = "Financial content intelligence service"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.111",
  "httpx>=0.27",
  "pydantic>=2.7",
  "sqlalchemy>=2.0.36",
  "PyYAML>=6.0",
  "uvicorn>=0.30",
]

[project.optional-dependencies]
test = ["pytest>=8.2", "pytest-cov>=5.0", "ruff>=0.8", "jsonschema>=4.23"]
core = []
postgres = ["psycopg[binary]>=3.2"]
search = ["qdrant-client>=1.12"]
media-cpu = [
  "faster-whisper>=1.1",
  "yt-dlp>=2025.1.26",
]
media-browser = ["playwright>=1.54"]
ocr = ["opencc-python-reimplemented>=0.1.7", "paddleocr==3.7.0"]
diarization = ["pyannote.audio>=3.1"]
# Paddle is installed only in the separate ocr-gpu environment.  Do not add
# it to ASR/Pyannote extras: their DLLs must never share a process/runtime.
multimodal-gpu = ["opencc-python-reimplemented>=0.1.7", "pyannote.audio>=3.1", "playwright>=1.54"]
media = [
  "faster-whisper>=1.1",
  "yt-dlp>=2025.1.26",
  "opencc-python-reimplemented>=0.1.7",
  "playwright>=1.54",
]
multimodal = [
  "faster-whisper>=1.1",
  "yt-dlp>=2025.1.26",
  "opencc-python-reimplemented>=0.1.7",
  "pyannote.audio>=3.1",
]

[project.scripts]
stock-content-worker = "stock_content.workers.content_worker:main"
stock-content-verification-worker = "stock_content.workers.verification_worker:main"
stock-content-signal-publisher = "stock_content.workers.signal_publisher_worker:main"
stock-content-rebuild-index = "stock_content.cli.rebuild_index:main"
stock-content-migrate = "stock_content.cli.migrate:main"
stock-content-ocr-doctor = "stock_content.cli.ocr_doctor:main"
stock-content-capture-storage-state = "stock_content.cli.capture_storage_state:main"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
