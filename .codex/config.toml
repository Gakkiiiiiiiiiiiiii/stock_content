# Cost-aware multi-agent baseline.
# Keep the root model unset: ordinary desktop/CLI sessions remain freely
# selectable. Launch scripts choose the model only for an explicit workflow.
# Sol stays reserved for formal review and high-risk supervision.
review_model = "gpt-5.6-sol"

# The root agent needs to run tests and inspect diffs. The supervisor prompt
# prohibits it from editing production code; luna_implementer owns those edits.
sandbox_mode = "workspace-write"

[agents]
enabled = true

# Do not fan out by default. Parallel work is read-only and must have a
# disjoint scope; each repository still has only one code writer.
max_concurrent_threads_per_session = 2
default_subagent_model = "gpt-5.6-luna"
default_subagent_reasoning_effort = "medium"
